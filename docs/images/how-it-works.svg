<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1430"/><stop offset="1" stop-color="#241a2a"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b86a3"/>
    </marker>
  </defs>
  <rect width="1000" height="420" rx="18" fill="url(#bg)"/>
  <text x="500" y="44" text-anchor="middle" font-size="20" font-weight="700" fill="#f4f2fb">How Tuckr works</text>

  <text x="40" y="92" font-size="12" font-weight="600" letter-spacing="1.5" fill="#8b86a3">YOU</text>
  <text x="400" y="92" font-size="12" font-weight="600" letter-spacing="1.5" fill="#8b86a3">THE APP</text>
  <text x="780" y="92" font-size="12" font-weight="600" letter-spacing="1.5" fill="#8b86a3">YOUR MAC</text>

  <g font-size="14" fill="#fff">
    <rect x="40" y="108" width="230" height="52" rx="12" fill="#6d4bd8"/>
    <text x="155" y="130" text-anchor="middle" font-weight="600">Hold Fn</text>
    <text x="155" y="148" text-anchor="middle" font-size="12" fill="#e5defa">talk, release</text>

    <rect x="40" y="188" width="230" height="52" rx="12" fill="#e8873a"/>
    <text x="155" y="210" text-anchor="middle" font-weight="600">Run Claude Code or Codex</text>
    <text x="155" y="228" text-anchor="middle" font-size="12" fill="#fbe7d3">in any terminal or editor</text>

    <rect x="40" y="268" width="230" height="52" rx="12" fill="#3b8f6a"/>
    <text x="155" y="290" text-anchor="middle" font-weight="600">Join a call</text>
    <text x="155" y="308" text-anchor="middle" font-size="12" fill="#d6f0e3">press Record</text>

    <rect x="40" y="348" width="230" height="52" rx="12" fill="#3c6fd1"/>
    <text x="155" y="370" text-anchor="middle" font-weight="600">Play music, check the day</text>
    <text x="155" y="388" text-anchor="middle" font-size="12" fill="#d8e3fa">hover the notch</text>
  </g>

  <rect x="320" y="104" width="360" height="300" rx="16" fill="#0d0b14" stroke="#3a3350"/>
  <g font-size="13" fill="#f4f2fb">
    <rect x="340" y="120" width="320" height="58" rx="10" fill="#1d1830"/>
    <text x="500" y="143" text-anchor="middle" font-weight="600">Dictation (Talkify)</text>
    <text x="500" y="162" text-anchor="middle" font-size="11.5" fill="#a9a3c2">on-device speech to text, HUD over the notch</text>

    <rect x="340" y="190" width="320" height="58" rx="10" fill="#1d1830"/>
    <text x="500" y="213" text-anchor="middle" font-weight="600">Agents (Coucou)</text>
    <text x="500" y="232" text-anchor="middle" font-size="11.5" fill="#a9a3c2">hook relay → local socket → cards, approvals, Mochi</text>

    <rect x="340" y="260" width="320" height="58" rx="10" fill="#1d1830"/>
    <text x="500" y="283" text-anchor="middle" font-weight="600">Meetings (Coucou Notetaker)</text>
    <text x="500" y="302" text-anchor="middle" font-size="11.5" fill="#a9a3c2">mic + system audio → local transcript → summary</text>

    <rect x="340" y="330" width="320" height="58" rx="10" fill="#1d1830"/>
    <text x="500" y="353" text-anchor="middle" font-weight="600">Home and Shelf (Boring Notch)</text>
    <text x="500" y="372" text-anchor="middle" font-size="11.5" fill="#a9a3c2">now playing, calendar, AirDrop, file shelf</text>
  </g>

  <g stroke="#8b86a3" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <path d="M272 134 H318"/><path d="M272 214 H318"/><path d="M272 294 H318"/><path d="M272 374 H318"/>
    <path d="M682 149 H738"/><path d="M682 219 H738"/><path d="M682 289 H738"/><path d="M682 359 H738"/>
  </g>

  <g font-size="14" fill="#fff">
    <rect x="740" y="124" width="220" height="52" rx="12" fill="#2a2440" stroke="#4a4266"/>
    <text x="850" y="146" text-anchor="middle" font-weight="600">Text where you type</text>
    <text x="850" y="164" text-anchor="middle" font-size="12" fill="#b8b2d0">any app</text>

    <rect x="740" y="194" width="220" height="52" rx="12" fill="#2a2440" stroke="#4a4266"/>
    <text x="850" y="216" text-anchor="middle" font-weight="600">Answer in the notch</text>
    <text x="850" y="234" text-anchor="middle" font-size="12" fill="#b8b2d0">allow, deny, jump to terminal</text>

    <rect x="740" y="264" width="220" height="52" rx="12" fill="#2a2440" stroke="#4a4266"/>
    <text x="850" y="286" text-anchor="middle" font-weight="600">Notes folder</text>
    <text x="850" y="304" text-anchor="middle" font-size="12" fill="#b8b2d0">transcript and summary</text>

    <rect x="740" y="334" width="220" height="52" rx="12" fill="#2a2440" stroke="#4a4266"/>
    <text x="850" y="356" text-anchor="middle" font-weight="600">Spotify, Calendar</text>
    <text x="850" y="374" text-anchor="middle" font-size="12" fill="#b8b2d0">controls and events</text>
  </g>
</svg>
